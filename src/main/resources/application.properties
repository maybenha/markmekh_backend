## ===== JPA / HIBERNATE =====
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.open-in-view=false

# Render will inject these environment variables; local development can use the commented-out values
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/markmekh_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# Key: keep update so tables are created automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===== JACKSON =====
spring.jackson.time-zone=Asia/Phnom_Penh

# ===== APP CUSTOM =====
app.jwt.secret=ChangeThisSecretKeyToAVeryLongRandomStringAtLeast64CharactersLongForHS512AlgorithmUse!
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.default.timezone=Asia/Phnom_Penh

# ===== LOGGING =====
logging.level.com.panha.markmekh=DEBUG
logging.level.org.springframework.security=INFO

# File Upload limits (increase to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB